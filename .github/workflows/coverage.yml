name: Coverage

on:
  push:
    branches: [master, ver/*, feat/*, renovate/*]
  pull_request:
    branches: [master, ver/*, feat/*, renovate/*]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Gate and Wat Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node with JSPI
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install clang and lld
        run: sudo apt-get install -y clang lld
      - name: Run Coverage
        run: bun run test:coverage
      - name: Run Wat Coverage
        run: bun scripts/lcov/wat.ts
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unittests
          disable_search: true
          fail_ci_if_error: false
      - name: Upload Wat Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/wat.info
          flags: wat
          disable_search: true
          fail_ci_if_error: false

  c:
    name: C Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Install the Toolchain
        run: sudo apt-get install -y clang lld llvm wabt
      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node with JSPI
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run the Corpora Under llvm-cov
        run: bun scripts/lcov/c.ts
      - name: Upload C Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/c.info
          flags: c
          disable_search: true
          fail_ci_if_error: false

  patch:
    name: Kernel Patch Coverage
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    timeout-minutes: 360

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Free Disk for the Pipeline
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install the Staging Tools
        run: sudo apt-get install -y wabt clang lld zlib1g-dev
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node with JSPI
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Resolve the Toolchain Key
        id: llvm
        run: echo "key=llvm-$(bun scripts/pin.ts linux-wasm commit)-$(bun scripts/pin.ts llvm commit)-${{ hashFiles('src/llvm/patches/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the Toolchain
        id: llvm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/llvm
          key: ${{ steps.llvm.outputs.key }}
      - name: Run the Pipeline from Source
        env:
          LLVM: ${{ steps.llvm-cache.outputs.cache-hit == 'true' && format('{0}/llvm', runner.temp) || '' }}
        run: CPUS=4 MEMORY=14g scripts/build-linux.sh "$RUNNER_TEMP/rebuild"
      - name: Stage the Build
        run: |
          scripts/build-kernel.sh "$RUNNER_TEMP/rebuild/out"
          mkdir -p build/probes
          cp "$RUNNER_TEMP/rebuild/out/probes/"* build/probes/
      - name: Build the Foreign ELFs
        run: LLVM=/usr/bin tests/c/katybug/run.sh
      - name: Count Kernel Function Entries Under the Probes
        run: bun scripts/lcov/patch.ts --out-dir "$RUNNER_TEMP/rebuild/out" --linux "$RUNNER_TEMP/rebuild/linux-wasm/workspace/src/kernel"
      - name: Upload Patch Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/patch.info
          flags: patch
          disable_search: true
          fail_ci_if_error: false
