name: Release Project

on:
  workflow_dispatch:
    inputs:
      changelog:
        type: string
        description: 'Changelog to replace the auto-generated one'
      suffix:
        type: string
        description: 'Suffix to append to the version'
        default: ''
      skip_npm:
        type: boolean
        description: 'Skip npmjs'
        default: false
      skip_github_npm:
        type: boolean
        description: 'Skip GitHub Packages (npm)'
        default: false
      skip_container:
        type: boolean
        description: 'Skip ghcr.io and Docker Hub'
        default: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refuse a Release Without a Pinned Build
        run: |
          if [ ! -f build.lock.json ]; then
            echo "::error::build.lock.json is absent: publish the build payload with bun run release:payload --publish and commit the lock first." >&2
            exit 1
          fi
      - name: Extract Version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Extracted Version: $VERSION"
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "package.json has no version field; the tag would be 'vundefined'." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Retrieve Latest Tag
        id: latest_tag
        run: |
          echo "LATEST_TAG=$(git describe --tags --abbrev=0 --exclude 'build-*' 2>/dev/null || echo '')" >> $GITHUB_ENV
      - name: Generate Changelog
        if: ${{ github.event.inputs.changelog == '' }}
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: '.github/release.json'
          mode: 'HYBRID'
          fromTag: '${{ env.LATEST_TAG }}'
          toTag: '${{ github.ref_name }}'
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}${{ github.event.inputs.suffix }}
          name: gmux v${{ env.VERSION }}${{ github.event.inputs.suffix }}
          body: ${{ steps.changelog.outputs.changelog || github.event.inputs.changelog }}
          draft: false
          prerelease: ${{ github.ref_name != 'master' }}

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 45

    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Read the Version and the Package Name
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE=$(node -p "require('./package.json').name")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "package.json has no version field." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PACKAGE=$PACKAGE" >> $GITHUB_ENV
      - name: Refuse to Publish an Untagged Version
        env:
          SUFFIX: ${{ github.event.inputs.suffix }}
        run: |
          TAG="v${VERSION}${SUFFIX}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} does not exist, so the release job did not create it. Refusing to publish an untagged version." >&2
            exit 1
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Publishing against ${TAG}."
      - name: Skip a Suffixed Release
        id: suffix
        env:
          SUFFIX: ${{ github.event.inputs.suffix }}
        run: |
          if [ -n "$SUFFIX" ]; then
            echo "Suffix '${SUFFIX}' given; package.json says ${VERSION}, so npm and the tag would disagree. Skipping the publish."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node with JSPI
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install clang and lld
        run: sudo apt-get install -y clang lld
      - name: Hydrate the Pinned Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run hydrate
      - name: Verify the Gate and the Probes Before Publishing
        run: |
          bun run typecheck
          bun run test
          bun run test:probes
          FROZEN=1 bun run test:probes
      - name: Build
        run: bun run build
      - name: Gather the Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p payload
          gh release download "$(jq -r .tag build.lock.json)" --dir payload
          bun run release:sbom dist/kernel payload/gmux.spdx.json
          npm pack --ignore-scripts --pack-destination payload
      - name: Attest the Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            payload/*.tgz
            payload/gmux-build.tar.gz
      - name: Attach the Assets to the Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            payload/gmux-build.tar.gz
            payload/manifest.json
            payload/SHA256SUMS
            payload/gmux.spdx.json
            payload/*.tgz
      - name: Set up Node for npm
        if: steps.suffix.outputs.skip == 'false' && !inputs.skip_npm
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
      - name: Check the Token Is Present
        if: steps.suffix.outputs.skip == 'false' && !inputs.skip_npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set on this repository. Add it under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
      - name: Check Whether the Version Is Already on the Registry
        if: steps.suffix.outputs.skip == 'false' && !inputs.skip_npm
        id: published
        run: |
          VERSIONS=$(npm view "$PACKAGE" versions --json 2>/dev/null || echo '[]')
          if echo "$VERSIONS" | grep -q "\"${VERSION}\""; then
            echo "${PACKAGE}@${VERSION} is already on the registry; skipping the publish so a re-run is idempotent."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish
        if: steps.suffix.outputs.skip == 'false' && !inputs.skip_npm && steps.published.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --ignore-scripts
      - name: Publish to Job Summary
        if: always() && steps.suffix.outputs.skip == 'false'
        run: |
          echo "## npm publish" >> $GITHUB_STEP_SUMMARY
          echo "- Package: \`${PACKAGE}@${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.skip_npm }}" = "true" ]; then
            echo "- Result: skipped, skip_npm was set" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.published.outputs.skip }}" = "true" ]; then
            echo "- Result: skipped, already on the registry" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Result: published with provenance" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Set up Node for GitHub Packages
        if: steps.suffix.outputs.skip == 'false' && !inputs.skip_github_npm
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@gmitch215'
      - name: Check Whether the Version Is Already on GitHub Packages
        if: steps.suffix.outputs.skip == 'false' && !inputs.skip_github_npm
        id: published_gh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSIONS=$(npm view "$PACKAGE" versions --json 2>/dev/null || echo '[]')
          if echo "$VERSIONS" | grep -q "\"${VERSION}\""; then
            echo "${PACKAGE}@${VERSION} is already on GitHub Packages; skipping so a re-run is idempotent."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish to GitHub Packages
        if: steps.suffix.outputs.skip == 'false' && !inputs.skip_github_npm && steps.published_gh.outputs.skip == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public --ignore-scripts
      - name: GitHub Packages to Job Summary
        if: always() && steps.suffix.outputs.skip == 'false'
        run: |
          echo "## GitHub Packages" >> $GITHUB_STEP_SUMMARY
          echo "- Package: \`${PACKAGE}@${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.skip_github_npm }}" = "true" ]; then
            echo "- Result: skipped, skip_github_npm was set" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.published_gh.outputs.skip }}" = "true" ]; then
            echo "- Result: skipped, already on GitHub Packages" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Result: published" >> $GITHUB_STEP_SUMMARY
          fi

  container:
    name: Publish Containers
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event.inputs.skip_container != 'true' }}

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7
      - name: Read the Version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Hydrate the Pinned Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run hydrate
      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log In to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide Whether Docker Hub Is Configured
        id: hub
        run: echo "enabled=${{ secrets.DOCKERHUB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Log In to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Derive the Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gmitch215/gmux
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ github.ref_name == 'master' }}
      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: gmux:check
      - name: Verify Image
        run: |
          docker run -d --rm --name gmux-check -p 8787:8787 gmux:check
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8787/_gmux/status > /dev/null && break; sleep 1; done
          bun run smoke http://127.0.0.1:8787
          docker stop gmux-check
      - name: Push Multi-Arch to ghcr.io
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Copy the Manifest to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          TAGS="--tag docker.io/${NAMESPACE}/gmux:${VERSION}"
          if [ "${{ github.ref_name }}" = "master" ]; then
            TAGS="$TAGS --tag docker.io/${NAMESPACE}/gmux:latest"
          fi
          docker buildx imagetools create $TAGS "ghcr.io/gmitch215/gmux@${DIGEST}"
      - name: Say Docker Hub Was Skipped
        if: steps.hub.outputs.enabled != 'true'
        run: echo "DOCKERHUB_TOKEN is not set, so only ghcr.io was published."
      - name: Record the Image Digest
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}${{ github.event.inputs.suffix }}
          append_body: true
          body: |
            Container image: `ghcr.io/gmitch215/gmux@${{ steps.push.outputs.digest }}`

  verify:
    name: Verify Targets
    needs: [publish, container]
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7
      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: https://npm.pkg.github.com
      - name: Log In to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide Whether Docker Hub Is Configured
        id: hub
        run: echo "enabled=${{ secrets.DOCKERHUB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Log In to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve Every Target
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_NPM: ${{ github.event.inputs.skip_npm }}
          SKIP_GITHUB_NPM: ${{ github.event.inputs.skip_github_npm }}
          SKIP_CONTAINER: ${{ github.event.inputs.skip_container }}
          DOCKERHUB: ${{ steps.hub.outputs.enabled }}
          NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 10 ]; then
                echo "::error::still failing after $attempt attempts: $*" >&2
                return 1
              fi
              attempt=$((attempt + 1))
              sleep 15
            done
          }
          if [ "$SKIP_NPM" != "true" ]; then
            retry npm view "@gmitch215/gmux@$VERSION" version --registry https://registry.npmjs.org
          fi
          if [ "$SKIP_GITHUB_NPM" != "true" ]; then
            retry npm view "@gmitch215/gmux@$VERSION" version --registry https://npm.pkg.github.com
          fi
          if [ "$SKIP_CONTAINER" != "true" ]; then
            retry docker manifest inspect "ghcr.io/gmitch215/gmux:$VERSION"
            if [ "$DOCKERHUB" = "true" ]; then
              retry docker manifest inspect "docker.io/${NAMESPACE}/gmux:$VERSION"
            fi
          fi
