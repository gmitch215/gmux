name: Build Project

on:
  push:
    branches: [master, ver/*, feat/*, renovate/*]
  pull_request:
    branches: [master, ver/*, feat/*, renovate/*]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Gate Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node with JSPI
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: bun run typecheck
      - name: Run Vitest Suite
        run: bun run test
      - name: Build the Library
        run: bunx tsc -p ./tsconfig.build.json
      - name: Install wabt
        run: sudo apt-get install -y wabt
      - name: Katybug Wasm Corpus Against V8
        run: bash tests/c/katybug/wasm-ops.sh

  payload:
    name: Build the Payload from Source
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 360

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Free Disk for the Pipeline
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install the Staging Tools
        run: sudo apt-get install -y wabt clang lld
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node with JSPI
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Resolve the Toolchain Key
        id: llvm
        run: echo "key=llvm-$(bun scripts/pin.ts linux-wasm commit)-$(bun scripts/pin.ts llvm commit)-${{ hashFiles('src/llvm/patches/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the Toolchain
        id: llvm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/llvm
          key: ${{ steps.llvm.outputs.key }}
      - name: Run the Pipeline from Source
        env:
          LLVM: ${{ steps.llvm-cache.outputs.cache-hit == 'true' && format('{0}/llvm', runner.temp) || '' }}
        run: CPUS=4 MEMORY=14g scripts/build-linux.sh "$RUNNER_TEMP/rebuild"
      - name: Pipeline Log on Failure
        if: failure()
        run: tail -100 "$RUNNER_TEMP/rebuild/out/build.log"
      - name: Keep the Toolchain
        id: keep
        if: ${{ !cancelled() && steps.llvm-cache.outputs.cache-hit != 'true' }}
        run: |
          llvm="$RUNNER_TEMP/rebuild/linux-wasm/workspace/install/llvm"
          if ls "$llvm"/lib/clang/*/lib/libclang_rt.builtins-wasm64.a > /dev/null 2>&1; then
            sudo mv "$llvm" "$RUNNER_TEMP/llvm"
            echo "kept=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the Toolchain
        if: ${{ !cancelled() && steps.keep.outputs.kept == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/llvm
          key: ${{ steps.llvm.outputs.key }}
      - name: Stage the Build
        run: |
          scripts/build-kernel.sh "$RUNNER_TEMP/rebuild/out"
          mkdir -p build/probes
          cp "$RUNNER_TEMP/rebuild/out/probes/"* build/probes/
      - name: Build and Check the Foreign ELFs
        run: LLVM=/usr/bin tests/c/katybug/run.sh
      - name: Cache the amd64 Userland
        uses: actions/cache@v6
        with:
          path: ~/gmux-rig/k3/out
          key: userland-${{ hashFiles('tests/c/katybug/userland-build.sh') }}
      - name: Stage the amd64 Transcripts Against Native Runs
        run: NATIVE_HOST=local tests/c/katybug/transcript.sh
      - name: Check Dynamic glibc and musl ELFs Against Native Runs
        run: NATIVE_HOST=local tests/c/katybug/dynamic.sh
      - name: Pack the Payload
        run: |
          bun run release:payload
          cd payload && sha256sum -c SHA256SUMS
      - name: Upload the Payload
        uses: actions/upload-artifact@v7
        with:
          name: gmux-build
          path: payload/
          retention-days: 30
      - name: Payload to Job Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Build payload"
            echo
            echo "Toolchain: \`${{ steps.llvm.outputs.key }}\` (cache hit: ${{ steps.llvm-cache.outputs.cache-hit || 'false' }})"
            echo
            echo '```txt'
            cat "$RUNNER_TEMP/rebuild/out/SHA256SUMS" 2> /dev/null || echo 'the pipeline did not finish'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  probes:
    name: Kernel Probes
    runs-on: ubuntu-latest
    needs: payload
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install wabt
        run: sudo apt-get install -y wabt
      - name: Download the Payload
        uses: actions/download-artifact@v8
        with:
          name: gmux-build
          path: payload
      - name: Hydrate the Payload
        run: bun run hydrate --from=payload/gmux-build.tar.gz
      - name: Run the Probes
        run: bun run test:probes
      - name: Run the Probes on a Frozen Clock
        run: FROZEN=1 bun run test:probes
      - name: Run the Probes on Shared Instances
        run: SHARE=1 bun run test:probes
      - name: Run the amd64 Transcripts Inside a Machine
        run: node --no-warnings --experimental-strip-types tests/c/katybug/transcript-gmux.ts

  snapshot:
    name: Snapshot Publish
    runs-on: ubuntu-latest
    needs: [payload, probes]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set up Node for GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@gmitch215'
      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download the Payload
        uses: actions/download-artifact@v8
        with:
          name: gmux-build
          path: payload
      - name: Hydrate the Payload
        run: bun run hydrate --from=payload/gmux-build.tar.gz
      - name: Stamp the Version with the Commit
        id: stamp
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SNAPSHOT="${VERSION}-${GITHUB_SHA::7}"
          npm version "$SNAPSHOT" --no-git-tag-version
          echo "version=$SNAPSHOT" >> $GITHUB_OUTPUT
      - name: Build
        run: bun run build
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public --tag snapshot --ignore-scripts
      - name: Snapshot to Job Summary
        if: always()
        env:
          SNAPSHOT: ${{ steps.stamp.outputs.version }}
        run: |
          echo "## Snapshot publish" >> $GITHUB_STEP_SUMMARY
          echo "- Package: \`@gmitch215/gmux@${SNAPSHOT}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Registry: GitHub Packages" >> $GITHUB_STEP_SUMMARY
          echo "- Install: \`bun add @gmitch215/gmux@${SNAPSHOT}\`" >> $GITHUB_STEP_SUMMARY

  image:
    name: Publish Dev Image to ghcr.io
    runs-on: ubuntu-latest
    needs: [payload, probes]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download the Payload
        uses: actions/download-artifact@v8
        with:
          name: gmux-build
          path: payload
      - name: Hydrate the Payload
        run: bun run hydrate --from=payload/gmux-build.tar.gz
      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log In to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: gmux:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke the Image
        run: |
          docker run -d --rm --name gmux-check -p 8787:8787 gmux:check
          for _ in $(seq 1 60); do curl -fs http://127.0.0.1:8787/_gmux/status > /dev/null && break; sleep 1; done
          if ! curl -fs http://127.0.0.1:8787/_gmux/status || ! bun run smoke http://127.0.0.1:8787; then
            docker logs gmux-check 2>&1 | tail -100
            exit 1
          fi
          docker stop gmux-check
      - name: Derive the Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gmitch215/gmux
          tags: |
            type=raw,value=dev
            type=sha,format=long
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
