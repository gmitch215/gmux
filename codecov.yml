coverage:
  precision: 2
  round: down
  range: '10...90'
  status:
    project:
      default:
        target: 60%
        threshold: 2%
    patch:
      default:
        target: 50%
        threshold: 5%

comment:
  layout: 'condensed_header, condensed_files, condensed_footer'
  require_changes: true

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: unittests
      paths:
        - src/
    - name: c
      paths:
        - src/gmux/
    - name: wat
      paths:
        - tests/fixtures/
        - scripts/wasm/
    - name: patch
      paths:
        - src/kernel/patches/

ignore:
  - '^tests/(?!fixtures/[^/]+\.wat$).*'
  - '^scripts/(?!wasm/[a-z]+-pass\.ts$).*'
  - 'coverage/**/*'
  - '.coverage/**/*'
  - '**/*.test.ts'
  - '**/*.spec.ts'
  - 'wrangler.jsonc'
  - 'dist/**/*'
  - 'src/worker/probes/**/*'
  - 'experiments/**/*'
  - 'build/**/*'
  - 'assets/**/*'
